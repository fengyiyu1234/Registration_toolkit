issues:
  - id: QC-COORD-001
    title: "coordinate_contract 与真实标签查询路径重复且未接入"
    priority: high
    status: resolved
    affected_files:
      - path: qc/coordinate_contract.py
        lines: "26-43"
        role: "支持 origin/spacing/direction 的新坐标 API"
      - path: qc/crop_geometry.py
        lines: "66-75"
        role: "实际 crop 流程仍使用旧的 origin-zero 标量换算"
      - path: qc/region_cells.py
        lines: "192-249"
        role: "LabelVolume.index_of/lookup/box/resample_to 忽略 direction"
    conflict: "计划要求非零 origin、各向异性 spacing 和非默认 direction；实际标签查询只处理 origin 与 spacing。"
    evidence:
      - "coordinate_contract.py 的 direction 参数没有被 LabelVolume 使用。"
      - "crop_geometry.global_px_to_label_voxel 仍是 px * voxel / spacing。"
      - "现有 scalar smoke test 通过，但没有 direction 测试。"
    next_actions:
      - "选择一个唯一坐标实现，并让 crop_geometry 与 LabelVolume 复用它。"
      - "从 NIfTI affine 提取完整 direction/origin，明确 LPS/RAS 约定。"
      - "增加非零 origin、各向异性 spacing、非默认 direction 的 lookup/box/resample 测试。"
    acceptance:
      - "任意坐标经过 global -> physical -> label -> physical 往返误差在明确容差内。"
      - "LabelVolume.lookup 与 LabelVolume.box 在非默认 direction 下返回正确标签。"

  - id: QC-COORD-002
    title: "任意全局坐标不能真正裁图或进入 Napari 证据链"
    priority: high
    status: open
    affected_files:
      - path: qc/qc_visualization.py
        lines: "39-56"
        role: "只解析坐标、最近细胞、标签和边界"
      - path: qc/qc_visualization.py
        lines: "103-119"
        role: "CLI 只打印 JSON；source_locations 仅对 --cell-id 执行"
      - path: qc/view_detection_qc.py
        lines: "356-369"
        role: "GUI 输入框将坐标描述为定位最近细胞"
      - path: qc/view_detection_qc.py
        lines: "444-450"
        role: "GUI locate_cell 将任意坐标吸附到最近 cell"
    conflict: "计划要求任意坐标保持为查看中心，并直接裁图；当前实现仍以最近细胞为中心，qc_visualization.py 也没有图像查看器。"
    evidence:
      - "--xyz 输出没有原始 tile/TIFF 候选。"
      - "--xyz 不创建 direct coordinate target，也不调用 source.cut。"
      - "现有 GUI 的 cell_id/坐标定位测试只验证最近细胞行为。"
    next_actions:
      - "为 DetectionSession 增加无 cell_id 的 coordinate target 和 direct cut 接口。"
      - "让 GUI 同时支持 cell target 与 coordinate target，坐标中心不可替换。"
      - "对任意坐标显示所有覆盖 tile，并允许选择默认/其他来源。"
      - "补充空点、无覆盖 tile、重叠 tile 和 tile 边缘测试。"
    acceptance:
      - "输入没有最终细胞的坐标仍能打开原始局部图像。"
      - "最近细胞只作为附加信息，不改变裁图中心。"
      - "局部图像可以叠加各阶段检测框、最终细胞和标签边界。"

