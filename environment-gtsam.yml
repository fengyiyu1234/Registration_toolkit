# `gt_sam` -- annotate_gt_sam.py 专用环境。
#
#     conda env create -f environment-gtsam.yml
#     conda activate gt_sam
#
# 为什么单独一个环境：micro_sam 会拉 torch 和它自己 pin 的 napari/numpy，装进
# antsreg 有把配准流水线依赖的 numpy/napari/antspyx 降级的风险。
#
# align_masks.py 在这个环境里也能跑（它刻意不 import 任何需要 antspyx 的东西）。
#
# 这里全部走 conda-forge 而不是 pip：micro_sam 只有 conda 包，且 torch 让 conda
# 解依赖比 pip 省事。micro_sam 和 python-elf 都是 noarch，Windows 上一样装得上。
#
# GPU：conda 会按平台挑 CPU 还是 CUDA 版 pytorch。装完确认一下
#     python -c "import torch; print(torch.__version__, torch.cuda.is_available())"
# 出来 False 而你有 N 卡，就显式装 CUDA 版：
#     conda install -c conda-forge "pytorch=*=cuda*"
# 纯 CPU 也能用，只是 SAM 推理慢，标注体验会明显变差。
#
# SAM checkpoint（vit_b_lm + decoder 约 410 MB）首次使用时自动下载到
# ~/.cache/micro_sam，Windows 上是 C:\Users\<you>\.cache\micro_sam。

name: gt_sam

channels:
  - conda-forge

dependencies:
  - python=3.11
  - micro_sam=1.8.8
  - napari=0.8.0
  - pyqt
  - simpleitk
  - pyyaml
  - numpy
  - scipy
  - pytest
