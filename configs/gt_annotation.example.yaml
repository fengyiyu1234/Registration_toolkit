# annotate_gt_sam.py 的配置模板。复制成 configs/gt_annotation.yaml（gitignored）
# 改成自己的真实路径，然后：
#
#   conda activate gt_sam
#   python annotate_gt_sam.py configs/gt_annotation.yaml
#
#   # 不开 GUI，只检查已有产物（可在无显示的机器上跑）：
#   python annotate_gt_sam.py configs/gt_annotation.yaml --verify

brain_id: tsc12t                 # 输出文件名前缀：{brain_id}_{region}.nii.gz

# 配准用的各向同性 3D 体数据（已归一化、已 brain mask）。
# 通常就是 ants pipeline 的 <name>_fine_<N>um.nii.gz——**必须**跟之后
# registration_eval.py 里 labels_in_sample.nii.gz 同一个网格，否则 Dice/HD95
# 算出来没有意义。不确定的话先跑一次：
#   python align_masks.py --check-only --source <此文件> --masks <labels_in_sample>
volume: /data/hdd12tb-1/fengyi/COMBINe/clearmap/TSC_ants/s12t/DevCCF_ver2_0804/tsc12t_fine_20um.nii.gz

output_dir: /data/hdd12tb-1/fengyi/COMBINe/clearmap/TSC_ants/s12t/gt_masks

# 可选，不写就默认 <output_dir>/annotated_slices_manifest.json。
# 这份清单是权威来源；每个 mask 旁边的 <mask>.annotated_slices.json 由它派生，
# registration_eval.py 会自动读取后者，把 Dice/HD95 限制在实际标注过的层上。
# manifest: /data/.../gt_masks/annotated_slices_manifest.json

# 可选，不写就默认 <output_dir>/_sam_embeddings。
# 每个 (brain, z) 一个独立的 .zarr，重新打开同一层时不用重算；**从不跨 z 复用**。
# 体积不小，可以放在临时盘上，删了只是下次重新算。
# embedding_cache_dir: /data/.../gt_masks/_sam_embeddings

# micro_sam 的模型。vit_b_lm 是光学显微镜微调版（默认）；vit_b 是原始 SAM。
# 显存/内存不够或者只有 CPU 时 vit_b_* 是合适的选择，vit_l_* / vit_h_* 更慢。
model_type: vit_b_lm

# 可选：'cpu' / 'cuda' / 'mps'。不写就自动选。本机 nvidia 驱动有版本不匹配问题
# 时，显式写 cpu 可以避免 torch 在初始化时报错。
# device: cpu

# 每个脑区在哪几层标注。**标注开始前锁定，之后不要改**——改了之后
# --verify 会把新增的层报成 "not in the config's locked slice list"。
# 不同脑区的层位置可以不同（本来就应该按各自最有代表性的位置挑）。
# 每个脑区单独一个文件，值只有 0/1，脑区内部不再细分；相邻脑区
# （cortex_surface vs cortex_wm）共享边界体素是允许的。
regions:
  ventricle:      [50, 80, 110, 140, 170]
  cortex_surface: [60, 90, 120, 150, 180]
  cortex_wm:      [60, 90, 120, 150, 180]
  hippocampus:    [70, 100, 130, 160, 190]
