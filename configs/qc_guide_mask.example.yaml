# tools/qc_guide_mask.py 的配置模板。复制成 configs/qc_guide_mask.yaml（gitignored）
# 再改成本机的真实路径：
#
#   cp configs/qc_guide_mask.example.yaml configs/qc_guide_mask.yaml
#   conda activate antsreg
#   python tools/qc_guide_mask.py                                 # 用 configs/qc_guide_mask.yaml
#   python tools/qc_guide_mask.py configs/qc_guide_mask.s12t.yaml # 或显式指定另一份

# 要审的那份 ../Registration_ants 流程配置。
#
# 这里只写这一个路径，不复制里面的值：画好的 mask、它的体素大小、原始 tiff、
# 图谱及其 orientation/slicing 全部从那份文件读。复制过来会漂移，而一个审的是
# 过期配对的 QC 工具比没有还糟 —— 它会给你一个虚假的"通过"。
registration_config: /home/fyu7/My_project/Registration_ants/configs/s12t.yaml

# 可选。拼图 PNG 的输出目录，默认写到 mask 旁边的 <mask 文件名>_qc/。
# out_dir: /data/hdd12tb-1/fengyi/COMBINe/Registration/qc/s12t_guide6

# 可选。每个 label 的拼图取多少个平面（默认 12）。游离关键层和空层一定会入选，
# 不受这个数字限制。
# planes: 12
