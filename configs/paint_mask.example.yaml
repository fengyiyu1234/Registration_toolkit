# paint_mask.py 的配置模板。复制成 configs/paint_mask.yaml（gitignored）
# 再改成本机的真实路径：
#
#   cp configs/paint_mask.example.yaml configs/paint_mask.yaml
#   conda activate antsreg
#   python paint_mask.py                                     # 用 configs/paint_mask.yaml
#   python paint_mask.py configs/paint_mask.guide_s12t.yaml  # 或显式指定另一份

# =====================================================================================
# 模式开关：guide | labels
# =====================================================================================
# guide  —— 在原图上从零画 guide outline，自己指定每个画笔号对应哪些脑区。
#            output_path 就是画出来的 outline。
# labels —— 从跑完的配准结果起手

mode: guide

common:
  # 样本图像，也是画布。两个模式都是它。
  image_path: /data/hdd12tb-1/fengyi/COMBINe/clearmap/TSC_ants/s12t/tsc12t_fine_25um.nii.gz

  # 导出路径（含义见上面的模式说明，两个模式都在 image_path 的网格上）。
  output_path: /data/hdd12tb-1/fengyi/COMBINe/clearmap/TSC_ants/s12t/s12t_guide_sample.nii.gz

  voxel_size_um: [2.6, 2.6, 32.0]

  atlas_annotation_path: /home/fyu7/My_project/Registration_ants/atlas/DevCCF/P04_DevCCF_Annotations_20um.nii.gz
  ontology_path:         /home/fyu7/My_project/Registration_ants/atlas/DevCCF/DevCCFv1_ontology.json

  # 图谱自己的分辨率，微米。labels 模式的 partition 面板按它算每个脑区的 mm³
  #（也就决定了哪些子结构够大、值得单独拆出来）。不写会按 25 假设并警告。
  atlas_resolution_um: 20

  region_labels:

  region_ids:

  # 【可选】把某几个画笔 label 标成"样本上存在、但图谱里没有对应物的组织"
  # （比如半脑样本局部越过中线多出的对侧薄片）。GUI 里也可以直接在 ontology
  # 树顶部选 "damage / no atlas counterpart" 分配给 label，效果一样。
  # 导出时这些 label 不进 region_ids/guide pair，而是写进 sidecar 的
  # damage_labels 键；Registration_ants 会自动读它并从配准 metric 里
  # 挖掉这些体素（等同 mask.guide_regions.damage_labels）。
  # 同一个 label 不能既是 damage 又配了 region_labels/region_ids。
  damage_labels:

# =====================================================================================
# guide —— 只有 mode: guide 读
# =====================================================================================
guide:
  existing_mask_path:

# =====================================================================================
# labels —— 只有 mode: labels 读
# =====================================================================================
labels:
  # 跑完配准得到的标签图（在 25um 各向同性网格上）
  labels_path: /data/hdd12tb-1/fengyi/COMBINe/clearmap/TSC_ants/s12t/DevCCF/tsc12t_labels_in_sample.nii.gz


  labels_voxel_size_um:

  # 稠密的“工作文件”写到哪儿：每个平面都有值（手画的关键帧 + 关键帧之间的插值 +
  # 其余平面照抄配准结果）。它不是给 pipeline 用的——喂给配准的是 output_path 那份
  # 稀疏 guide。留空则默认 <output_path 去扩展名>_atlas.nii.gz。
  # 旧名 atlas_output_path 仍然可用（里面的 “atlas” 从来不是指 atlas 空间，
  # 这个文件和 output_path 一样在原始 stack 的网格上）。
  dense_output_path: /data/hdd12tb-1/fengyi/COMBINe/clearmap/TSC_ants/s12t/DevCCF/tsc12t_corrected_atlas.nii.gz

  # 接着上次画：从哪个稠密工作文件恢复（连同它的 .keyframes.json）。
  # 留空 = 从 dense_output_path 读，也就是“存档存回同一个文件”。
  # 想让每一轮各留一份快照，就把它指向上一轮的稠密文件，dense_output_path 换新名字：
  #   resume_from:        .../tsc12t_corrected_atlas.nii.gz
  #   dense_output_path:  .../tsc12t_corrected_atlas2.nii.gz
  #   output_path:        .../tsc12t_guide2.nii.gz
  # 恢复回来的只有记录在案的手画平面；中间的插值平面每次都从 labels_path 重算，
  # 所以 labels_path 永远指向最初的配准输出，绝不要改成这里的稠密文件。
  resume_from:

  partition_path: /home/fyu7/My_project/Registration_ants/atlas/mask/s12t_DeMBAguide7.regions.json

  # 展开一个分组时，小于这个体积（mm³）的子结构不单独成组，留在父组里。
  # 依据是实测：小于 1mm³ 的 guide 区手圈边界误差占比太大，会主动把形变往错误方向拽，
  # 比不加引导更糟（见 Registration_ants/configs/config.example.yaml）。
  min_region_mm3: 1.0
