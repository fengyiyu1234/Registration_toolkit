# single_sample.py 的配置模板。复制成 configs/single_sample.yaml（gitignored）
# 再改成本机的真实路径：
#
#   cp configs/single_sample.example.yaml configs/single_sample.yaml
#   conda activate antsreg
#   python single_sample.py
#
# 想同时留几个样本的配置，就各存一份、运行时显式指定，互不覆盖：
#   python single_sample.py configs/single_sample.s12t.yaml
#
# 字符串里的 ~ 和 ${VAR} 会被展开，两台机器数据盘挂载点不同时可以写成
# ${BRAIN_DATA}/TSC_ants/s12t/DevCCF，同一份文件两边都能用。

# 1. 单个样本的工作目录（对应 pipeline 配置 s12t.yaml 里
#    atlas_variants.<variant>.output_dir）。
#    这个目录既支持 ANTs 产出（<name>_fine_*um.nii.gz + <name>_labels_in_sample.nii.gz），
#    也支持 ClearMap 原生产出（resampled.tif + volume/result.mhd），
#    由 DataLoader.resolve_native_paths 自动判断，不需要在这里声明是哪一种。
#    两种产出缺件时的降级行为：
#      - 缺样本空间标签图（ClearMap 的 volume/result.mhd 没跑成功是常见情况）：
#        细胞点、脑区搜索、按脑区筛选照常（这些只依赖 cell_registration.csv），
#        只是没有图谱轮廓、hover 查不了脑区。这个文件由 cellMap.py 的
#        transform_annotation_volume() 生成，要这两项功能就重跑它补上。
#      - ClearMap 开了 registration.crop_for_registration：标签图和 elastix 结果
#        都在裁剪后的小网格上，而细胞坐标在未裁剪网格上，脚本按 log.txt 里记的
#        偏移自动补齐（见下面第 6 条）。
sample_dir: /data/hdd12tb-1/fengyi/COMBINe/clearmap/TSC_ants/s12t/DevCCF

# 2. 标准 Atlas 标签文件。必须是**已经按 pipeline 配置里的 orientation /
#    slicing 转换过**、跟 labels_in_sample.nii.gz 处在同一空间的那一份，
#    否则 "Atlas Space View" 里图谱和细胞点对不上。
#    看 ClearMap 的样本时换成 ClearMap 自己 prepare 出来的那一份，例如
#    ClearMap/Resources/Atlas/p5_trimmed/DeMBA_P5_annotation_trimmed_<orientation>__<slicing>.tif
#    （文件名里的 orientation/slicing 要和该样本 log.txt 里记的一致）。
std_atlas_path: /home/fyu7/My_project/Registration_ants/atlas/DevCCF/P04_DevCCF_Annotations_20um_1_-3_2__320-640_full_full.nii.gz

# 3. JSON 格式脑区字典，必须和 std_atlas_path 是同一套图谱的。
#    ANTs 走 DevCCF（只有 id）；ClearMap 走 CCF v3（id + graph_order 都有，
#    例如 ClearMap/Resources/Atlas/p5_trimmed/CCF_v3_ontology.json）。
#    两套编号数值大面积重合，脚本靠 cell_registration.csv 第 10 列的脑区名
#    自动判断该文件第 9 列用的是哪一套，启动时会打印判定结果，不用在这里声明。
ontology_json_path: /home/fyu7/My_project/Registration_ants/atlas/DevCCF/DevCCFv1_ontology.json

# 4. 可选：Native 视图显示哪张样本图。
#    默认用 sample_dir 里自动找到的降采样图（resampled.tif / *_fine_*um.nii.gz），
#    看细节会糊；填上原始配准 tiff（pipeline 配置里的 sample.raw_tiff）就改用它，
#    几 GB~几十 GB 也没关系 —— tiff 走 memmap / zarr 懒加载，napari 只读当前那一层。
#    标签图和细胞点仍在降采样网格上，这张图靠 scale 自动对齐（= 降采样图形状 /
#    原图形状，各轴独立算，z 和 xy 倍数不同也没问题），启动时会打印算出来的 scale。
#    填了这个之后 Grid 默认关掉，变成"图谱轮廓叠在高分原图上"，面板上可以随时切回并排。
# native_image_path: /data/.../raw_data/s12t/registration.tif
#
#    自动比例是形状之比，最多差半个降采样体素（2273→296 那种量级误差 0.2%，够用）。
#    想精确、或者原图裁过边/加过 padding 导致视野不同时，在这里手动写死。
#    顺序是 [z, y, x]（注意和 pipeline 配置里 voxel_size_um 的 [x,y,z] 相反），
#    值 = 原始体素尺寸 ÷ fine_target_um，含义是"一个原始体素 = 几个降采样体素"。
#    例：raw voxel [2.6, 2.6, 32] µm、fine_target_um: 20 → [32/20, 2.6/20, 2.6/20]
# native_image_scale: [1.6, 0.13, 0.13]

# 5. 可选：视图旋转，只影响显示方向，不改动任何文件。
#    0 = 不旋转，1 = 逆时针 90°，2 = 180°，3 = 顺时针 90°。
#    细胞坐标会跟着一起旋转（DataLoader.rotate_pts），所以点和图不会错位。
view_rotate_k: 0

# 6. 可选：样本空间标签图相对未裁剪网格的偏移，按 [z, y, x]（napari 轴序）。
#    只有 ClearMap 开了 registration.crop_for_registration 时才用得上：那时
#    volume/result.mhd 在裁剪后的小网格上，而细胞坐标在未裁剪的 resampled.tif
#    网格上，两者要对齐得先把标签图按裁剪偏移补回去。
#    默认从该样本目录的 log.txt 里解析（cellMap.py 打的那行
#    "Cropped resampled image: (296, 517, 252) -> (296, 517, 232), offset=[ 0. 0. 20.]"，
#    注意日志里是 ClearMap 的 [x,y,z] 轴序，这里要写成反过来的 [z,y,x]）。
#    日志被清掉、或跑的是不打这行的老版本 cellMap.py 时，在这里手写；
#    两处都没有的话脚本会跳过标签图而不是画一张错位的（宁缺毋滥）。
# labels_crop_offset: [20, 0, 0]

# 7. 可选：碎片复位（reposition）。
#    只有裂开过、跑 pipeline 时配了 sample.reposition_plan 的样本才用得上。
#    那种样本的配准是在"把碎片合拢之后"的几何上跑的，所以 *_fine_*um.nii.gz、
#    *_labels_in_sample.nii.gz、细胞表第 4-6 列全在合拢后的坐标系里；而上面第 4 条
#    的 native_image_path（= pipeline 配置里的 sample.raw_tiff）是没合拢的原图。
#    两者叠在一起看时，图谱是一整块完整的脑，碎片所在的位置底下什么标签都没有，
#    hover 一律回答 background —— 尽管那块组织的细胞其实都配准到了脑区上。
#
#    所以 Native 视图会多建一层 "Atlas Regions (fragments moved back)"：同一份配准
#    结果按同一个 plan 送回没合拢的几何，碎片的脑区搬回碎片真正所在的位置，合拢后
#    被它填上的窟窿留空。完整的那一层原样保留，控制面板上的
#    "Fragments moved back" 开关切哪一层可见 —— hover / 点击 / 搜索高亮读的都是
#    当前选中的那一层。显示的正是 plan 里记的那张原图时默认打开，否则默认关闭。
#
#    plan 的路径默认从样本目录里那份 pipeline 配置快照读（run_pipeline.sh 会把跑
#    这一次用的 config 拷进 output_dir），所以一般什么都不用写。没有碎片就不会多
#    这一层。快照出现之前跑的老结果没有那个文件，用下面两条之一指过去：
# registration_config: /home/fyu7/My_project/Registration_ants/configs/s18.yaml
# reposition_plan: /home/fyu7/My_project/Registration_ants/atlas/mask/s18/s18_DeMBA5.reposition.json
#
#    写成空字符串 = 明确不要这一层（`reposition_plan: ""`）。
