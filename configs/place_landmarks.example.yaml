# place_landmarks.py 的配置模板。复制成 configs/place_landmarks.yaml（gitignored）
# 再改成本机的真实路径：
#
#   cp configs/place_landmarks.example.yaml configs/place_landmarks.yaml
#   conda activate antsreg
#   python place_landmarks.py              # 弹出表单，字段用下面的值预填，可临时改
#   python place_landmarks.py --no-form    # 不弹表单，直接按这份配置打开 napari
#
# 这份配置是**可选**的：没有它时脚本仍然照旧弹表单（字段用 .dialog_state/ 里
# 上次用过的值预填）。有它时，这里写了的字段优先于上次记录 —— 否则改了 config
# 却看不出效果。
#
# sample / atlas 两个角色要跑两次，且**同一个解剖点必须在两张图里按同样的顺序
# 点**（registration_eval.py 的 compute_tre 是按行号配对的，不做最近邻匹配）。
# 建议给两个角色各存一份配置，避免来回改同一个文件：
#   python place_landmarks.py configs/place_landmarks.s12t_sample.yaml
#   python place_landmarks.py configs/place_landmarks.s12t_atlas.yaml

role: sample                    # "sample" | "atlas"

# role=sample: 样本图像（跟配准实际跑的是同一个各向同性网格，
#              一般是 <name>_fine_25um.nii.gz）。
# role=atlas:  图谱模板本身（例如 DeMBA P5 的 .tif）。
image_path: /data/hdd12tb-1/fengyi/COMBINe/clearmap/TSC_ants/s12t/tsc12t_fine_25um.nii.gz

# 导出的 landmark CSV，列是 index,axis-0,axis-1,axis-2（本图自己的 (z,y,x) 体素坐标）。
# 填进 registration_eval.py 的 landmarks_sample / landmarks_atlas。
output_csv: /data/hdd12tb-1/fengyi/COMBINe/clearmap/TSC_ants/s12t/landmarks_sample.csv

# 可选：从上次导出的 CSV 继续点（接着加点 / 改点），不写就从空图层开始。
points_csv: null
